[project]
name = "clearline-dental-backend"
version = "0.1.0"
description = "Appointment booking API for Clearline Dental"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
