<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Clearline Dental — modern, gentle dental care in Hermosillo. Book your visit online in under a minute."
    />
    <meta name="theme-color" content="#0b4f4a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS: preload it and switch to a stylesheet once loaded, so the
         first paint uses the fallback font instead of waiting on Google Fonts. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      onload="
        this.onload = null;
        this.rel = 'stylesheet';
      "
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <title>Clearline Dental</title>
    <script>
      // Motion toggle, applied before the first paint (mirrors app/motion-preference.tsx):
      // a saved choice wins; otherwise follow the OS prefers-reduced-motion setting.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("clearline-motion");
        } catch (e) {}
        var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        document.documentElement.dataset.motion =
          choice === "on" || choice === "off" ? choice : reduce ? "off" : "on";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
