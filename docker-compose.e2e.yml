# Production image + Postgres, as on Railway: for the CI end-to-end tests and for checking
# the production build locally. Not for development (use docker-compose.yml).
#
#   E2E_SECRET_KEY=... docker compose -f docker-compose.e2e.yml up --build -d
#
# Every value here is throwaway test data; E2E_SECRET_KEY is generated per run (CI does it
# in the workflow) and never stored. The site is served on http://localhost:8088.
name: clearline-e2e

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clearline_e2e
      POSTGRES_USER: clearline_e2e
      POSTGRES_PASSWORD: e2e-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearline_e2e -d clearline_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Plays Railway's "Pre-deploy Command": runs once, before the web service starts.
  migrate:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &web-env
      DJANGO_SECRET_KEY: ${E2E_SECRET_KEY:?set E2E_SECRET_KEY (any random 50+ char string)}
      DATABASE_URL: postgres://clearline_e2e:e2e-only-password@db:5432/clearline_e2e
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8088
      DEMO_MODE: ${E2E_DEMO_MODE:-true}
      DEMO_RECEPTIONIST_PASSWORD: ${E2E_DEMO_RECEPTIONIST_PASSWORD:-}
      DEMO_PATIENT_PASSWORD: ${E2E_DEMO_PATIENT_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    environment:
      <<: *web-env
      PORT: "8080"
      WEB_CONCURRENCY: "2"
    ports:
      - "8088:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health/', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
